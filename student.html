<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 반 화재대피 안내 · 대구일중학교</title>
<style>
:root{--navy:#1B2A4A;--sky:#5B9BD5;--gold:#C9A227;--ink:#1A1A1A;--line:#D8E0EC;--bg:#F4F7FB;--red:#C0392B;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Pretendard','Malgun Gothic','맑은 고딕',sans-serif;color:var(--ink);background:var(--bg);line-height:1.7;}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 50px;}
header{color:#fff;padding:30px 24px 24px;border-radius:0 0 18px 18px;}
.g1{background:linear-gradient(135deg,#C9A227,#a9881f);} .g2{background:linear-gradient(135deg,#1F7A3D,#176030);} .g3{background:linear-gradient(135deg,#1B2A4A,#23375f);}
header .sup{font-size:13px;font-weight:600;opacity:.9;}
header h1{font-size:26px;font-weight:800;margin:5px 0 8px;}
header .when{display:inline-block;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);padding:5px 13px;border-radius:20px;font-size:13.5px;font-weight:700;}
section{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-top:16px;box-shadow:0 2px 8px rgba(27,42,74,.05);}
.lab{font-size:13px;font-weight:800;color:var(--navy);margin-bottom:13px;letter-spacing:.02em;}
.flow{display:flex;flex-direction:column;gap:0;}
.fstep{display:flex;align-items:center;gap:12px;}
.fbox{flex:1;background:#F7FAFD;border:1.5px solid var(--navy);color:var(--navy);font-weight:700;font-size:15px;padding:12px 15px;border-radius:10px;}
.fstep:first-child .fbox{background:var(--navy);color:#fff;}
.fstep:last-child .fbox{background:var(--gold);color:#fff;border-color:var(--gold);font-size:16px;}
.fnum{flex:0 0 26px;height:26px;background:var(--sky);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;}
.farr{height:16px;margin:3px 0 3px 12px;border-left:2px dashed var(--sky);}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.rule{background:#FFF6F5;border:1px solid #E6B0AA;border-radius:10px;padding:13px;text-align:center;font-weight:700;font-size:14px;color:var(--red);}
.rule .ic{font-size:22px;display:block;margin-bottom:4px;}
.sch{width:100%;border-collapse:collapse;font-size:13.5px;}
.sch td{padding:7px 6px;border-bottom:1px solid #EEF2F7;}
.sch td:first-child{font-weight:700;color:var(--navy);white-space:nowrap;}
.sch td:nth-child(2){text-align:right;color:#445;white-space:nowrap;}
.sch tr.hot td{background:#FDEEEC;color:var(--red);font-weight:800;}
.err{text-align:center;padding:50px 20px;color:#889;}
footer{text-align:center;color:#99a;font-size:12px;margin-top:22px;}
</style></head>
<body>
<div id="app"></div>

function render(){
